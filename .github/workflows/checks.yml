name: Python checks
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src run.py tools examples tests
      - run: ruff format --check src run.py tools examples tests
      - run: python -m unittest discover -s tests -v
      - run: python examples/create_synthetic.py --destination .local/synthetic
      - run: python run.py --root .local/synthetic --offline
