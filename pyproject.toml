[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sp500-top10"
version = "0.1.0"
description = "Reproducible concentrated S&P 500 index construction, backtesting and attribution"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["duckdb==1.5.5", "numpy==2.5.2", "pandas==3.0.5", "statsmodels==0.15.0", "yfinance==1.7.0"]

[project.optional-dependencies]
dev = ["ruff==0.16.8", "ipykernel==7.3.0"]

[project.scripts]
sp500-top10 = "sp500_top10.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sp500_top10 = ["data/sql/*.sql"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".private", ".migration", ".local", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
"examples/*.py" = ["E402"]
"tests/test_operations.py" = ["E402"]
